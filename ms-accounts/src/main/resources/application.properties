spring.application.name=ms-accounts
server.port=8081
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:5433/db_accounts
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

management.endpoints.web.exposure.include=health,info

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

resilience4j.circuitbreaker.instances.ms-clients.sliding-window-size=5
resilience4j.circuitbreaker.instances.ms-clients.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-clients.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-clients.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.ms-clients.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.ms-clients.max-attempts=3
resilience4j.retry.instances.ms-clients.wait-duration=2s

ms.clients.url=http://localhost:8080/api